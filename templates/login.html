<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - QuienLoTiene</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">QuienLoTiene</h1>
            <nav class="space-x-4">
                <a href="/" class="hover:underline">Inicio</a>
                <a href="/registro" class="hover:underline">Registrarse</a>
                <a href="/login" class="underline font-bold">Iniciar sesión</a>
            </nav>
        </div>
    </header>

    <section class="container mx-auto px-4 py-12">
        <div class="bg-white rounded-lg shadow-lg p-6 md:p-8 max-w-md mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Iniciar sesión</h2>
            <p class="text-gray-600 mb-6">Accede con tu correo y contraseña</p>

            <form id="formLogin" class="space-y-4">
                <div>
                    <label for="email" class="block text-gray-700 font-medium mb-2">
                        Correo electrónico *
                    </label>
                    <input type="email" id="email" name="email" required
                           placeholder="tu@correo.com"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="password" class="block text-gray-700 font-medium mb-2">
                        Contraseña *
                    </label>
                    <input type="password" id="password" name="password" required
                           placeholder="Tu contraseña"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                    Entrar
                </button>
            </form>

            <div id="mensaje" class="mt-4 hidden"></div>

            <div class="mt-6 pt-6 border-t border-gray-200 text-center text-sm text-gray-600">
                ¿No tienes cuenta? 
                <a href="/registro" class="text-blue-600 hover:underline font-medium">
                    Regístrate aquí
                </a>
            </div>
        </div>
    </section>

    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>QuienLoTiene &copy; 2026</p>
        </div>
    </footer>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const mensaje = document.getElementById('mensaje');

            mensaje.className = 'mt-4 p-4 bg-blue-100 text-blue-800 rounded-lg';
            mensaje.textContent = '⏳ Verificando...';
            mensaje.classList.remove('hidden');

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();

                if (data.ok) {
                    mensaje.className = 'mt-4 p-4 bg-green-100 text-green-800 rounded-lg';
                    mensaje.innerHTML = `✅ ¡Bienvenido, <strong>${data.usuario.nombre}</strong>!<br><small>Redirigiendo...</small>`;
                    
                    // Redirigir según el rol
                    setTimeout(() => {
                        if (data.usuario.rol === 'proveedor') {
                            window.location.href = '/proveedor';
                        } else {
                            window.location.href = '/mis-solicitudes';
                        }
                    }, 1000);
                } else {
                    mensaje.className = 'mt-4 p-4 bg-red-100 text-red-800 rounded-lg';
                    mensaje.textContent = '❌ ' + (data.error || 'Credenciales incorrectas');
                }
            } catch (err) {
                mensaje.className = 'mt-4 p-4 bg-red-100 text-red-800 rounded-lg';
                mensaje.textContent = '❌ Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
