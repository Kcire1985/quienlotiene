# fly.toml app configuration file

app = "quienlotiene"  # Puedes cambiar el nombre si quieres
primary_region = "mia"  # Región de Miami, la más cercana a Venezuela

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Permite que la app se detenga cuando no hay tráfico

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256