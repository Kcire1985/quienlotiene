<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuienLoTiene</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-blue-500 text-white p-4 text-center">
        <h1>QuienLoTiene</h1>
    </header>
    <main class="p-4">
        <div class="container mx-auto p-4 pt-6 mt-10">
            <div class="flex flex-wrap -mx-4">
                <div class="w-full xl:w-8/12 p-4">
                    <div class="bg-white shadow rounded-lg p-6">
                        <!-- Tarjeta de solicitud -->
                        <h2 class="text-lg font-bold mb-4">Solicitud de compra</h2>
                        <form>
                            <div class="mb-4">
                                <label for="product" class="block text-gray-700 text-sm font-bold mb-2">Producto:</label>
                                <input type="text" id="product" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                            </div>
                            <div class="mb-4">
                                <label for="quantity" class="block text-gray-700 text-sm font-bold mb-2">Cantidad:</label>
                                <input type="number" id="quantity" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                            </div>
                            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">Enviar solicitud</button>
                        </form>
                    </div>
                </div>
                <div class="w-full xl:w-4/12 p-4">
                    <div class="bg-white shadow rounded-lg p-6">
                        <!-- Tarjeta de ofertas -->
                        <h2 class="text-lg font-bold mb-4">Ofertas</h2>
                        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" data-toggle="modal" data-target="#ofertasModal">Ver ofertas</button>
                        <!-- Modal de ofertas -->
                        <div class="modal fade" id="ofertasModal" tabindex="-1" role="dialog" aria-labelledby="ofertasModalLabel" aria-hidden="true">
                            <div class="modal-dialog" role="document">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="ofertasModalLabel">Ofertas</h5>
                                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <!-- Contenido del modal -->
                                        <p>Ofertas disponibles:</p>
                                        <ul>
                                            <li>Oferta 1</li>
                                            <li>Oferta 2</li>
                                            <li>Oferta 3</li>
                                        </ul>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
